[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "c50py"
version = "0.5.2"
description = "C5.0 decision trees and rulesets for Python: native categorical splits, missing values, boosting and rules exported to SQL, as scikit-learn estimators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Díaz Solís", email = "daviddiazsolis@gmail.com" }]
keywords = ["decision tree", "C5.0", "C4.5", "categorical", "interpretable machine learning", "scikit-learn", "rules", "rulesets", "SQL", "explainable AI"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.2"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
graphviz = ["graphviz>=0.20"]
plot = ["matplotlib>=3.3"]
dev = ["pytest>=7", "pandas>=1.3", "matplotlib>=3.3"]

[project.urls]
Homepage = "https://github.com/daviddiazsolis/c50py"
Documentation = "https://github.com/daviddiazsolis/c50py/blob/main/USAGE_GUIDE.md"
Changelog = "https://github.com/daviddiazsolis/c50py/blob/main/CHANGELOG.md"
Issues = "https://github.com/daviddiazsolis/c50py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
