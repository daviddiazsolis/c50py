name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9",  sklearn: "" }
          - { os: ubuntu-latest,  python: "3.11", sklearn: "" }
          - { os: ubuntu-latest,  python: "3.13", sklearn: "" }
          - { os: windows-latest, python: "3.12", sklearn: "" }
          - { os: macos-latest,   python: "3.12", sklearn: "" }
          # oldest supported scikit-learn
          - { os: ubuntu-latest,  python: "3.11", sklearn: "scikit-learn==1.3.2 numpy<2 pandas<2.3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.sklearn }} -e ".[dev]"
      - name: Test
        run: pytest -q
