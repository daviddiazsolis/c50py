name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI Trusted Publishing:
# no token needed once the publisher is registered on pypi.org
# (Project c50py > Settings > Publishing > GitHub: owner daviddiazsolis,
#  repository c50py, workflow publish.yml, environment pypi).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
